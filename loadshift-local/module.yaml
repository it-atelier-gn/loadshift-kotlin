description: In-process backend that runs loadshift workflows
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: enabled

dependencies:
  - ../loadshift-core:
      exported: true
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime

test-dependencies:
  - $libs.kotlinx.coroutines.test
