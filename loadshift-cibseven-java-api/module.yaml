description: Works a CIB seven engine in the same JVM through its Java API, without a REST connection
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: enabled
  jvm:
    test:
      freeJvmArgs:
        - -Xmx512m

dependencies:
  - ../loadshift-camunda-7:
      exported: true
  - ../loadshift-core:
      exported: true
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.cibseven.engine:
      scope: compile-only
  - $libs.cibseven.engine.plugin.spin:
      scope: compile-only

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.cibseven.engine
  - $libs.cibseven.engine.plugin.spin
  - $libs.cibseven.spin.dataformat.json.jackson
  - $libs.h2
