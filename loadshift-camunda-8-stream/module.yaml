description: Job streaming over gRPC for the loadshift Camunda 8 backend
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: json

dependencies:
  - ../loadshift-core
  - ../loadshift-camunda-8
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.camunda.client.java
  - $libs.jackson.core
  - $libs.jackson.databind
  - $libs.netty.codec
  - $libs.netty.codec.compression
  - $libs.netty.codec.http
  - $libs.netty.codec.http2
  - $libs.netty.codec.socks
  - $libs.netty.handler.proxy

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.testcontainers
