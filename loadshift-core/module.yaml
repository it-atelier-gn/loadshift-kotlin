description: Kotlin DSL for durable workflows, run configuration, Backend API and BPMN compiler
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: json
    freeCompilerArgs:
      - -Xcontext-parameters

dependencies:
  - $libs.kotlinx.coroutines.core:
      exported: true
  - $libs.kotlinx.datetime:
      exported: true
  - $libs.kotlinx.serialization.json:
      exported: true
  - $libs.camunda.bpmn.model:
      exported: true

test-dependencies:
  - $libs.kotlinx.coroutines.test
