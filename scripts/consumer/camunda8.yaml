camunda:
  security:
    authentication:
      method: "basic"
      unprotectedApi: true
    authorizations:
      enabled: false
  data:
    secondary-storage:
      type: rdbms
      rdbms:
        url: jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1
        username: sa
        password:
        flushInterval: PT0.5S
