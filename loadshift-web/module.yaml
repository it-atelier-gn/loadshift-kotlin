description: Web console and JSON API for loadshift runs
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: json

dependencies:
  - ../loadshift-core
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.kotlinx.datetime
  - $libs.ktor.server.core
  - $libs.ktor.server.cio
  - $libs.ktor.server.content.negotiation
  - $libs.ktor.server.auth
  - $libs.ktor.server.auth.jwt
  - $libs.ktor.server.sessions
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.client.cio
  - $libs.ktor.client.content.negotiation

test-dependencies:
  - ../loadshift-local
  - $libs.kotlinx.coroutines.test
