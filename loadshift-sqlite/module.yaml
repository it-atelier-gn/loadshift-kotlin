description: SQLite log sink, checkpoint store, dead-letter store and run registry for loadshift
product: jvm/lib

apply:
  - ../templates/library.module-template.yaml

settings:
  kotlin:
    serialization: json
  jvm:
    test:
      freeJvmArgs:
        - --enable-native-access=ALL-UNNAMED

dependencies:
  - ../loadshift-core
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime
  - $libs.kotlinx.serialization.json
  - $libs.sqlite.jdbc

test-dependencies:
  - $libs.kotlinx.coroutines.test
