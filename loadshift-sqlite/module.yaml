product: jvm/lib

settings:
  publishing:
    enabled: true
    group: io.github.it-atelier-gn
    version: 0.5.0
  kotlin:
    serialization: json

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: false
    publish: true

dependencies:
  - ../loadshift-core
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.datetime
  - $libs.kotlinx.serialization.json
  - $libs.sqlite.jdbc

test-dependencies:
  - $libs.kotlinx.coroutines.test
